# Cargo Deny configuration for Project Gibberish

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # Zero-Trust guardrail: firmware must never depend on host cryptographic key vaults
    # or plaintext crypto dependencies
    { name = "x25519-dalek", wrappers = [] },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
