[package]
name = "gibberish-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "gibberish-client"

[lib]
name = "gibberish_client"
path = "src/lib.rs"

[[bin]]
name = "gibberish-client"
path = "src/main.rs"

[dependencies]
slint = "1.9"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
log = { workspace = true }
env_logger = "0.11"
gibberish-protocol = { path = "../../crates/gibberish-protocol" }
gibberish-crypto = { path = "../../crates/gibberish-crypto" }
gibberish-db = { path = "../../crates/gibberish-db" }
thiserror = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
hkdf = "0.12"
bip39 = "2.1"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
slint-snapshot = "0.1.2"
