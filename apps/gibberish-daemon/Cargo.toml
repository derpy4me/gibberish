[package]
name = "gibberish-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "gibberish-daemon"

[lib]
name = "gibberish_daemon"
path = "src/lib.rs"

[[bin]]
name = "gibberish-daemon"
path = "src/main.rs"

[[bin]]
name = "gibberish-sink"
path = "src/bin/gibberish_sink.rs"

[[bin]]
name = "fleet_sink_test"
path = "src/bin/fleet_sink_test.rs"

[[bin]]
name = "hw_stress_test"
path = "src/bin/hw_stress_test.rs"

[[bin]]
name = "ota_mesh_test"
path = "src/bin/ota_mesh_test.rs"

[dependencies]
gibberish-protocol = { path = "../../crates/gibberish-protocol" }
gibberish-crypto = { path = "../../crates/gibberish-crypto" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serialport = { workspace = true }
arboard = { workspace = true }
blake3 = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.128"
